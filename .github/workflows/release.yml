name: Release

# Bump "version" in manifest.json (and versions.json), push to main:
# if no release exists for that version yet, this builds the plugin and publishes
# a GitHub release (tag = version, no "v") with the three files Obsidian needs.
# Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $v already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: "22"

      - name: Build and test
        if: steps.v.outputs.exists == 'false'
        run: |
          npm ci
          npx eslint src
          npm run build
          npm test

      - name: Attest build provenance
        if: steps.v.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            main.js manifest.json styles.css
